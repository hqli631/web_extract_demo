<!doctype html><meta charset="utf-8"><title>网页区域框选复核</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px Arial}header{height:64px;padding:10px;background:#172033;color:#fff;display:flex;gap:8px;align-items:center}select,button{padding:7px}#stage{position:relative;overflow:auto;height:calc(100vh - 64px);background:#f2f4f7;padding:12px}iframe{width:100%;height:1600px;background:#fff;border:1px solid #999}.box{position:absolute;border:2px solid #2674e8;background:#2674e822;z-index:4;cursor:pointer}.box span{position:absolute;top:-19px;left:-2px;background:#2674e8;color:#fff;font-size:11px;padding:2px}.box.body{border-color:#159447;background:#15944722}.box.body span{background:#159447}.box.noise{border-color:#d34040;background:#d3404022}.box.noise span{background:#d34040}.box.missing{border-color:#d88b00;background:#d88b0022}.box.missing span{background:#d88b00}.panel{position:fixed;right:0;top:64px;width:300px;height:calc(100vh - 64px);overflow:auto;background:#fff;padding:12px;border-left:1px solid #ccc}.card{border-top:1px solid #ddd;padding:8px 0}.card p{line-height:1.4;max-height:90px;overflow:auto}
</style>
<header><b>原网页区域复核</b><select id="page"></select><button data-label="body">正文</button><button data-label="noise">杂质</button><button data-label="missing">缺漏</button><button id="export">导出标注</button><span id="status"></span></header><div id="stage"><iframe id="source"></iframe></div><aside class="panel"><p>点击原网页上的框，再点击顶部标签。绿色=正文，红色=杂质，橙色=缺漏。</p><div id="list"></div></aside>
<script>
const files=['blog_01.html','blog_02.html','forum_01.html','forum_02.html','news_01.html','news_02.html'],page=document.querySelector('#page'),frame=document.querySelector('#source'),stage=document.querySelector('#stage'),list=document.querySelector('#list'),state={};let selected;
files.forEach(f=>{let o=document.createElement('option');o.value=f;o.textContent=f;page.append(o);state[f]=[]});
const clean=s=>(s||'').replace(/\s+/g,' ').trim();
function render(){document.querySelectorAll('.box').forEach(x=>x.remove());list.replaceChildren();(state[page.value]||[]).forEach((r,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>区域 '+(i+1)+' · '+(r.label||'待标注')+'</b><p>'+r.text.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</p>';list.append(d)});document.querySelector('#status').textContent='已记录 '+(state[page.value]||[]).length+' 个区域'}
function inspect(){document.querySelectorAll('.box').forEach(x=>x.remove());let doc=frame.contentDocument,nodes=[...doc.querySelectorAll('h1,h2,h3,p,article,main,section,li,div')].filter(n=>!n.closest('script,style')&&clean(n.innerText).length>=20&&!n.querySelector('p,h1,h2,h3,li'));nodes.forEach((n,i)=>{let r=n.getBoundingClientRect();if(r.width<20||r.height<8)return;let b=document.createElement('div');b.className='box';b.style.left=(r.left+stage.scrollLeft+12)+'px';b.style.top=(r.top+stage.scrollTop+12)+'px';b.style.width=r.width+'px';b.style.height=r.height+'px';let s=document.createElement('span');s.textContent=i+1;b.append(s);b.onclick=e=>{e.stopPropagation();let rows=state[page.value];let x=rows.find(x=>x.key===i);if(!x){x={key:i,text:clean(n.innerText),tag:n.tagName.toLowerCase(),label:''};rows.push(x)}selected={box:b,row:x};b.style.zIndex=8;render()};stage.append(b)});render()}
page.onchange=()=>{frame.src='../samples/'+page.value};frame.onload=inspect;frame.src='../samples/'+page.value;
document.querySelectorAll('[data-label]').forEach(btn=>btn.onclick=()=>{if(selected){selected.row.label=btn.dataset.label;selected.box.className='box '+btn.dataset.label;render()}});
document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='visual_annotations.json';a.click()};
</script>
