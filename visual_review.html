<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原网页区域复核</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#213047}header{padding:10px;background:#172033;color:white;display:flex;align-items:center;gap:14px;height:56px}select,button{padding:6px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 56px)}iframe{width:100%;height:100%;border:0;background:white}aside{overflow:auto;border-left:1px solid #ccd4df;padding:12px}.card{padding:10px;border:1px solid #ddd;margin:8px 0;cursor:pointer}.card.active{border:3px solid #006aff}.card p{max-height:100px;overflow:auto;white-space:pre-wrap}.hint{line-height:1.7;color:#526075}#warning{color:#b83b23}a{color:inherit}</style>
<header><b>原网页区域复核</b><select id="page"></select><label><input id="boxes" type="checkbox" checked>显示区域框</label><button id="width">全宽对照</button><button id="export">导出本页修正</button><span id="status">加载中</span></header>
<main><iframe id="source" sandbox="allow-scripts allow-same-origin" title="保存的原网页"></iframe><aside><div class="hint">点击网页上的文字或编号，右侧定位对应区域；点击右侧区域，网页滚动到原位置。框上显示编号及标签。可区分正文、标题、时间、来源、广告、导航、侧栏、工具、图片等。自动标签只是候选；缺漏表示应补回的正文。<br><b id="saveState">标注自动保存到 reports/annotations.json</b><br><a id="original" target="_blank" rel="noopener">对照未加框的本地原文件</a></div><p id="warning"></p><div id="list"></div></aside></main>
<script>
const $=s=>document.querySelector(s),frame=$('#source'),page=$('#page');let rows=[],cards=new Map(),saved={};
const labels={body:'正文',title:'标题',time:'发布时间',source:'来源',author:'作者',navigation:'导航',advertisement:'广告',recommendation:'相关推荐',sidebar:'侧栏',comment:'评论',toolbar:'功能工具',footer:'页脚版权',image:'图片',media:'音视频',noise:'其他杂质',pending:'待判断',missing:'缺漏'};
function post(m){frame.contentWindow.postMessage(m,location.origin)}
async function loadSaved(){try{saved=await (await fetch('/reports/annotations.json?'+Date.now())).json()}catch{saved={}}}
function result(){return {schema_version:2,label_definitions:labels,file:page.value,source:'rendered-dom-review',regions:rows,title:rows.filter(r=>r.label==='title').map(r=>r.text).join('\n'),metadata:rows.filter(r=>['time','source','author'].includes(r.label)),content:rows.filter(r=>['body','missing'].includes(r.label)).map(r=>r.text).join('\n')}}
let saveTimer;
function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await fetch('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result())});$('#saveState').textContent='已自动保存到 reports/annotations.json'}catch{$('#saveState').textContent='自动保存失败，请检查服务'}},300)}
function load(){rows=[];cards.clear();$('#list').replaceChildren();$('#status').textContent='正在加载网页与区域…';$('#original').href='/samples/'+encodeURIComponent(page.value);frame.src='/snapshot/'+encodeURIComponent(page.value)}
function highlight(id){for(const [key,c]of cards)c.classList.toggle('active',key===id);cards.get(id)?.scrollIntoView({block:'nearest'})}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data.source!=='region-review')return;const m=e.data;
if(m.type==='selected')highlight(m.id);
if(m.type==='regions'){rows=m.regions;$('#status').textContent=page.value+' · '+rows.length+' 个区域（文字及非文本）';$('#warning').textContent=rows.length?'网页保留已保存的样式；缺失资源或依赖在线脚本的布局无法保证与在线页面完全一致。':'没有找到可见文字。请对照本地原文件，确认保存的 HTML 是否含正文。';$('#list').replaceChildren();
for(const r of rows){const c=document.createElement('div');c.className='card';const b=document.createElement('b');b.textContent='区域 '+r.id+' · '+r.tag+' · '+labels[r.auto_label];const p=document.createElement('p');p.textContent=r.text;const s=document.createElement('select');for(const [value,text]of Object.entries(labels)){const o=new Option(text,value);s.add(o)}s.value=r.label;s.onclick=e=>e.stopPropagation();s.onchange=()=>{r.label=s.value;post({type:'label',id:r.id,label:r.label})};c.onclick=()=>post({type:'select',id:r.id});c.append(b,p,s);cards.set(r.id,c);$('#list').append(c)}post({type:'boxes',enabled:$('#boxes').checked})}});
$('#boxes').onchange=()=>post({type:'boxes',enabled:$('#boxes').checked});page.onchange=load;
$('#width').onclick=()=>{const hide=$('aside').style.display!=='none';$('aside').style.display=hide?'none':'';$('main').style.gridTemplateColumns=hide?'1fr':'';$('#width').textContent=hide?'显示区域列表':'全宽对照'};
$('#export').onclick=()=>{const result={schema_version:2,label_definitions:labels,file:page.value,source:'rendered-dom-review',regions:rows,title:rows.filter(r=>r.label==='title').map(r=>r.text).join('\n'),metadata:rows.filter(r=>['time','source','author'].includes(r.label)),content:rows.filter(r=>['body','missing'].includes(r.label)).map(r=>r.text).join('\n')};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=page.value.replace('.html','')+'_reviewed.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
if(location.protocol==='file:'){$('#status').textContent='请通过本地服务打开';$('#warning').textContent='先运行 start_review.ps1，再访问 http://127.0.0.1:8765/visual_review.html。直接双击文件无法可靠读取 iframe。'}else{fetch('/api/pages').then(r=>r.json()).then(files=>{for(const f of files)page.add(new Option(f,f));if(files.length)load();else $('#status').textContent='samples 中没有 HTML 文件'}).catch(e=>$('#status').textContent='加载失败：'+e.message)}
</script><script>
// 自动持久化：标注写入项目 reports/annotations.json，模型可直接读取该文件。
document.addEventListener('change',e=>{if(e.target.tagName!=='SELECT'||!rows.length)return;autoSave()});
window.addEventListener('beforeunload',()=>{if(rows.length){navigator.sendBeacon('/api/annotations',new Blob([JSON.stringify(result())],{type:'application/json'}))}});
</script></html>
