<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>正文优先复核</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#213047}header{padding:10px;background:#172033;color:white;display:flex;flex-wrap:wrap;align-items:center;gap:12px}select,button{padding:6px}main{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:88vh}iframe{width:100%;height:100%;border:0;background:white}aside{overflow:auto;border-left:1px solid #ccd4df;padding:12px}.card{padding:10px;border:1px solid #ddd;margin:8px 0;cursor:pointer}.active{border:3px solid #006aff}.card p{max-height:90px;overflow:auto}textarea{width:100%;height:75px}pre{white-space:pre-wrap;max-height:240px;overflow:auto;background:#f2f6fa;padding:10px}#warning{color:#a33}</style>
<header><b>正文优先复核</b><select id="page"></select><label><input id="mainOnly" type="checkbox" checked>正文优先（含区外正文）</label><label><input id="boxes" type="checkbox" checked>区域框</label><button id="confirm">确认当前列表标签</button><button id="save">保存本页</button><button id="export">导出备份</button><span id="status"></span></header>
<main><iframe id="source" sandbox="allow-scripts allow-same-origin" title="保存的原网页"></iframe><aside>
<p>先看正文预览，修正主区；取消“只看正文主区”查找漏提。点击文字或卡片定位，选父区域可批量处理。自动预测不算人工真值，检查后请确认列表。</p><b id="saveState">尚未保存</b><p id="warning"></p><a id="original" target="_blank" rel="noopener">对照未加框的原文件</a>
<details open><summary>正文预览</summary><pre id="preview"></pre></details>
<details><summary>批量修正 / XPath 规则</summary><p id="selection">先点击一个区域</p><button id="parent">选择上一层父区域</button><button id="include">整块保留正文</button><button id="exclude">整块排除正文</button><p>XPath 定位链（JSON 数组；普通页面一段，Shadow DOM 按宿主分段）：</p><textarea id="xpath">[]</textarea><select id="ruleLabel"><option value="body">保留正文</option><option value="noise">排除正文</option></select><p>应用到样本文件（逗号分隔；仅填同模板页面）：</p><input id="ruleFiles" style="width:100%" placeholder="留空仅应用本页"><button id="testRule">测试匹配</button><button id="saveRule">保存本页规则</button><p id="ruleStatus"></p></details><div id="list"></div></aside></main>
<script>
const $=s=>document.querySelector(s),frame=$('#source'),page=$('#page');
const labels={body:'正文',title:'标题',time:'发布时间',source:'来源',author:'作者',navigation:'导航',advertisement:'广告',recommendation:'相关推荐',sidebar:'侧栏',comment:'评论',toolbar:'功能工具',footer:'页脚版权',image:'图片',media:'音视频',noise:'其他杂质',pending:'待判断',missing:'缺漏'};
let rows=[],cards=new Map(),saved={},currentFile='',snapshot='',group=[],saveTimer,queue=Promise.resolve(),dirty=false,ready=false,ruleTest=null;
const post=m=>frame.contentWindow.postMessage(m,location.origin),body=r=>['body','missing'].includes(r.label);
function visible(){return rows.filter(r=>!$('#mainOnly').checked||r.is_main||body(r)||group.includes(r.id))}
function result(){return {schema_version:3,file:currentFile,snapshot,source:'rendered-dom-review',regions:structuredClone(rows),content:rows.filter(body).map(r=>r.text).join('\n'),updated_at:new Date().toISOString()}}
function persist(payload){queue=queue.catch(()=>{}).then(async()=>{const response=await fetch('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw Error(await response.text());saved[payload.file]=payload;if(currentFile===payload.file)$('#saveState').textContent='已保存：reports/annotations.json'}).catch(e=>{$('#saveState').textContent='保存失败：'+e.message;throw e});return queue}
function changed(){dirty=true;clearTimeout(saveTimer);const payload=result();$('#saveState').textContent='正在自动保存…';saveTimer=setTimeout(()=>persist(payload).catch(()=>{}),300);preview()}
async function flush(){clearTimeout(saveTimer);if(dirty&&rows.length){await persist(result());dirty=false}else await queue}
function preview(){$('#preview').textContent=rows.filter(body).map(r=>r.text).join('\n\n')||'当前没有正文。';$('#status').textContent=`${currentFile} · 显示 ${visible().length}/${rows.length} 区域 · 人工确认 ${rows.filter(r=>r.reviewed).length}`}
function render(){cards.clear();$('#list').replaceChildren();for(const r of visible()){const c=document.createElement('div');c.className='card'+(group.includes(r.id)?' active':'');const b=document.createElement('b');b.textContent=`#${r.id} · ${r.tag} · ${r.reviewed?'已确认':'未确认'} · 预测：${labels[r.predicted_label]}`;const p=document.createElement('p');p.textContent=r.text;const select=document.createElement('select');for(const [v,t]of Object.entries(labels))select.add(new Option(t,v));select.value=r.label;select.onclick=e=>e.stopPropagation();select.onchange=()=>{r.label=select.value;r.reviewed=true;post({type:'label',id:r.id,label:r.label});changed();render()};c.onclick=()=>post({type:'select',id:r.id});c.append(b,p,select);cards.set(r.id,c);$('#list').append(c)}preview()}
function sync(){post({type:'boxes',enabled:$('#boxes').checked,focus:$('#mainOnly').checked});for(const r of rows)if(r.reviewed)post({type:'label',id:r.id,label:r.label})}
async function load(){ready=false;dirty=false;currentFile=page.value;rows=[];group=[];ruleTest=null;$('#xpath').value='[]';$('#selection').textContent='先点击一个区域';$('#list').replaceChildren();$('#preview').textContent='';$('#status').textContent='加载中…';$('#original').href='/samples/'+encodeURIComponent(currentFile);frame.src='/snapshot/'+encodeURIComponent(currentFile)}
page.onchange=async()=>{page.disabled=true;const next=page.value;page.value=currentFile;try{await flush();page.value=next;await load()}catch{page.value=currentFile;ready=true}finally{page.disabled=false}};
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data.source!=='region-review')return;const m=e.data;if(m.file!==currentFile)return;if(m.type==='regions'){rows=m.regions;snapshot=m.snapshot;const old=saved[currentFile],matches=old?.snapshot===snapshot;if(matches){const map=new Map(old.regions.map(r=>[JSON.stringify(r.locator)+'|'+r.text,r]));for(const r of rows){const p=map.get(JSON.stringify(r.locator)+'|'+r.text);if(p?.reviewed){r.label=p.label;r.reviewed=true}}}$('#warning').textContent=old&&!matches?'样本已变，旧标注未套用，请重新复核。':'主区域是启发式候选；外观取决于样本资源是否完整。';ready=true;render();sync();$('#saveState').textContent=matches?'已恢复同一快照的人工标注':'自动预测尚未人工确认';if(matches)changed();}
if(m.type==='selected'||m.type==='group'){group=m.ids||[m.id];$('#selection').textContent=`已选择 ${group.length} 个区域：${m.text||''}`;$('#xpath').value=JSON.stringify(m.locator);ruleTest=null;render();cards.get(m.id)?.scrollIntoView({block:'nearest'})}
if(m.type==='rule-match'){ruleTest={locator:$('#xpath').value,ids:m.ids};$('#ruleStatus').textContent=m.error||`匹配 ${m.ids.length} 个区域，编号：${m.ids.join(', ')}`;group=m.ids;render()}});
$('#mainOnly').onchange=()=>{group=[];render();sync()};$('#boxes').onchange=sync;$('#parent').onclick=()=>post({type:'parent'});
function bulk(label){if(!ready)return;for(const r of rows.filter(r=>group.includes(r.id))){r.label=label;r.reviewed=true;post({type:'label',id:r.id,label})}changed();render()}
$('#include').onclick=()=>bulk('body');$('#exclude').onclick=()=>bulk('noise');$('#confirm').onclick=()=>{if(!ready)return;for(const r of visible())r.reviewed=true;changed();render()};$('#save').onclick=()=>{if(ready){dirty=true;flush().catch(()=>{})}};
$('#testRule').onclick=()=>{try{const locator=JSON.parse($('#xpath').value);if(!Array.isArray(locator)||!locator.length)throw Error('先选择区域或输入定位链');post({type:'test-rule',locator})}catch(e){$('#ruleStatus').textContent=e.message}};
$('#saveRule').onclick=async()=>{try{if(!ruleTest?.ids.length||ruleTest.locator!==$('#xpath').value)throw Error('先测试 XPath 并核对区域');const res=await fetch('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:currentFile,files:$('#ruleFiles').value.trim()?$('#ruleFiles').value.split(',').map(s=>s.trim()):[currentFile],locator:JSON.parse($('#xpath').value),label:$('#ruleLabel').value})});if(!res.ok)throw Error(await res.text());$('#ruleStatus').textContent='已保存 config/rules.json，刷新本页后应用；后写入的规则优先。'}catch(e){$('#ruleStatus').textContent=e.message}};
$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(result(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=currentFile+'_reviewed.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
addEventListener('beforeunload',()=>{if(dirty&&rows.length)navigator.sendBeacon('/api/annotations',new Blob([JSON.stringify(result())],{type:'application/json'}))});
async function apiJSON(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok||!r.headers.get('Content-Type')?.includes('application/json'))throw Error(`接口 ${path} 返回 HTTP ${r.status}，当前端口上的服务未提供新版接口。请在终端运行 powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\start_review.ps1 -Port 8768，并打开终端打印的 Open 地址。刷新网页不会更新后台服务。`);return r.json()}
async function init(){if(location.protocol==='file:')throw Error('请运行 start_review.ps1，通过终端打印的 HTTP 地址打开');saved=await apiJSON('/api/annotations');const files=await apiJSON('/api/pages');for(const f of files)page.add(new Option(f,f));if(files.length)load();else $('#warning').textContent='samples 文件夹中没有 HTML 样本。'}
init().catch(e=>$('#warning').textContent=e.message);
</script></html>
